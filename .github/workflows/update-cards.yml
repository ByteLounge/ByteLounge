name: Update Profile Stats

on:
  schedule:
    # Runs twice a day at 00:00 UTC and 12:00 UTC (05:30 & 17:30 IST)
    - cron: "0 0,12 * * *"
  workflow_dispatch: # Allows manual trigger from Actions tab anytime
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-cards.yml"

permissions:
  contents: write

jobs:
  update-profile-cards:
    name: Generate & Update Profile Cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch stats & generate cards
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: "ByteLounge"
          LEETCODE_USER: "yashsanikop"
        run: node scripts/generate-cards.mjs

      - name: Commit & push updated cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes in generated SVG assets. Everything is up to date."
          else
            git commit -m "chore(stats): update GitHub contributions, LeetCode & profile cards [skip ci]"
            git push origin main
          fi
